spring.application.name=waterleague-api
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.name=__Host-waterleague
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/waterleague}
spring.datasource.username=${DB_USER:waterleague}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
spring.flyway.enabled=true
waterleague.artifacts=${ARTIFACTS_PATH:../data/runs}
waterleague.native-spatial-cache=${NATIVE_SPATIAL_CACHE:../tmp/native-spatial}
waterleague.mfa-key=${MFA_ENCRYPTION_KEY:}
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB

waterleague.kma-key=${KMA_API_KEY:}
waterleague.discord-webhook-url=${DISCORD_WEBHOOK_URL:}

waterleague.external-request-state-dir=${EXTERNAL_REQUEST_STATE_DIR:../data/private/external-requests}
