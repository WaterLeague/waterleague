[project]
name = "waterleague-simulation"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["psycopg[binary]==3.3.6", "pyproj==3.8.0", "shapely==2.2.0"]

[project.optional-dependencies]
flood = ["anuga==4.0.1"]

[tool.uv]
# 제공 격자를 사용하므로 비상업용 Triangle을 포함한 생성기는 설치하지 않는다.
exclude-dependencies = ["meshpy", "triangle"]
