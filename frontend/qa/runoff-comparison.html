<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>유출·저류 비교 · 로컬 검증</title>
  </head>
  <body style="margin: 0; background: #f2f3ee; font: 14px system-ui; color: #284133">
    <header style="padding: 20px; border-bottom: 1px solid #cad5c5">
      <strong>로컬 QA · 제품 빌드 제외</strong>
      <p>2022. 08. 08 집중호우 · 강남 공개 후보 · 20m² 시설의 실제 계산 결과</p>
      <button id="bioretention">생물저류시설</button>
      <button id="roof">녹화지붕</button>
      <p id="status" role="status"></p>
    </header>
    <main id="root" style="max-width: 380px; padding: 16px; margin: auto"></main>
    <script type="module">
      if (!import.meta.env.DEV || !['localhost', '127.0.0.1', '[::1]'].includes(location.hostname))
        throw new Error('로컬 개발 환경 전용');
      const [{ default: React }, { createRoot }, { RunoffComparison }, { default: fixture }] =
        await Promise.all([
          import('react'),
          import('react-dom/client'),
          import('/src/domains/physics/view/RunoffComparison.tsx'),
          import('/src/domains/physics/view/fixtures/publicRunoffComparison.json'),
        ]);
      const root = createRoot(document.getElementById('root'));
      function render(index) {
        const value = fixture.cases[index];
        document.getElementById('status').textContent =
          (index ? '녹화지붕' : '생물저류시설') + ' · ' + value.cellId;
        root.render(React.createElement(RunoffComparison, { value: value.comparison }));
      }
      document.getElementById('bioretention').onclick = () => render(0);
      document.getElementById('roof').onclick = () => render(1);
      render(0);
    </script>
  </body>
</html>
