<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>주간 시즌 설치·점수 · 로컬 검증</title>
  </head>
  <body style="margin: 0; background: #f2f3ee; font: 14px system-ui; color: #284133">
    <header style="padding: 20px; border-bottom: 1px solid #cad5c5">
      <strong>로컬 UI QA · 제품 빌드 제외 · 합성 회원/점수</strong>
      <p>공개 설치 후보·예산 조회, 서버 저장 없는 표시 시험</p>
      <button id="mine">내 시설 보기</button><button id="other">다른 회원 위치에 설치</button>
      <p id="status" role="status">내 시설 · 시즌 고정 확인</p>
    </header>
    <main id="root" style="max-width: 400px; margin: 20px auto"></main>
    <script type="module">
      if (!import.meta.env.DEV || !['localhost', '127.0.0.1', '[::1]'].includes(location.hostname))
        throw new Error('로컬 개발 환경 전용');
      const [
        { default: React },
        { createRoot },
        { FacilityPlacementPanel },
        { SiteScoreRows },
        { loadSite },
      ] = await Promise.all([
        import('react'),
        import('react-dom/client'),
        import('/src/domains/installation/view/FacilityPlacementPanel.tsx'),
        import('/src/domains/weekly/view/SiteScores.tsx'),
        import('/src/domains/installation/repository/installationRepository.ts'),
        import('/src/shared/ui/base.css'),
        import('/src/shared/ui/game.css'),
        import('/src/domains/game/view/play.css'),
        import('/src/domains/city/view/shared-play.css'),
      ]);
      const site = await loadSite('2410520', 'G1');
      const budget = await (await fetch('/api/v1/budget')).json();
      const h = React.createElement,
        root = createRoot(document.getElementById('root'));
      const scoreRows = {
        installations: [null, 0, -0.125].map((scoreM3, n) => ({
          id: String(n),
          ownerId: String(n),
          ownerName: '시험 회원 ' + n,
          facilityType: 'PERMEABLE_PAVEMENT',
          areaM2: 10,
          installedAt: '2026-10-19T00:00:00Z',
          seasonEndsAt: '2026-10-25T15:00:00Z',
          scoreM3,
          evaluatedMinutes: n ? 3 : 0,
          evaluatedThrough: n ? '2026-10-19T00:03:00Z' : null,
        })),
        nextAfterId: null,
      };
      function show(mine) {
        document.getElementById('status').textContent = mine
          ? '내 시설 · 시즌 고정 확인'
          : '다른 회원 시설이 있는 위치 · 신규 설치 가능 확인';
        root.render(
          h(
            FacilityPlacementPanel,
            {
              site,
              type: 'PERMEABLE_PAVEMENT',
              area: '10',
              onType: () => {},
              onArea: () => {},
              districtName: '강남구',
              context: '로컬 UI 시험',
              budget,
              remaining: budget.remainingKrw,
              limit: budget.policy.personalLimitKrw,
              budgetReady: true,
              busy: false,
              canInstall: true,
              research: false,
              occupied: mine
                ? {
                    facilityType: 'PERMEABLE_PAVEMENT',
                    areaM2: 10,
                    cost: 1100000,
                    ownerName: '시험 회원 0',
                    seasonEndsAt: '2026-10-25T15:00:00Z',
                    onRemove: () => {
                      throw new Error('주간 철거 노출 오류');
                    },
                  }
                : undefined,
              onInstall: () => {
                document.getElementById('status').textContent =
                  '설치 버튼 활성 확인 · 서버 저장 없음';
              },
            },
            h(
              'section',
              { className: 'weekly-site-scores' },
              h('h3', null, '이 위치의 시설별 누적 점수 · 합성 UI 시험'),
              h(SiteScoreRows, { value: scoreRows, viewerId: '0' })
            )
          )
        );
      }
      document.getElementById('mine').onclick = () => show(true);
      document.getElementById('other').onclick = () => show(false);
      show(true);
    </script>
  </body>
</html>
