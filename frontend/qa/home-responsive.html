<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>홈페이지 반응형 검증 · 로컬</title>
    <style>
      body {
        margin: 20px;
        font: 14px system-ui;
        background: #eaf1f9;
        color: #263d55;
      }
      main {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      iframe {
        height: 820px;
        border: 1px solid #bdccdd;
        background: white;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      if (!import.meta.env.DEV || !['localhost', '127.0.0.1', '[::1]'].includes(location.hostname))
        throw new Error('로컬 화면 검증 전용');
      for (const width of [375, 1024]) {
        const figure = document.createElement('figure');
        const caption = document.createElement('figcaption');
        caption.textContent = width + 'px 홈페이지';
        const frame = document.createElement('iframe');
        frame.title = width + 'px 홈페이지';
        frame.width = String(width);
        frame.src = '/#home-seoul';
        figure.append(caption, frame);
        document.getElementById('root').append(figure);
      }
    </script>
  </body>
</html>
