name: 기반 검증
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm format:check && pnpm test && pnpm build && pnpm audit --audit-level=high
        working-directory: frontend
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: bash scripts/build_swmm.sh
      - run: test -f tmp/swmm-build/install/bin/libswmm5.so
      - run: python -m unittest discover -s tests -v
        working-directory: simulation
      - run: python scripts/verify_snapshot.py
      - run: python scripts/verify_model.py
      - run: python scripts/verify_references.py --rerun
